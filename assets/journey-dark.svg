<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="jt jd">
<title id="jt">A figure walking Dhodraj Sundaram's career</title>
<desc id="jd">A self-playing walk along a career line. A small figure moves left to right through four stages, each with its span: Student 2018 – 2022; Graduate 2022 – 2023; Software Engineer 2023 – 2025; Tech Lead 2025 – present. Stages are evenly spaced for reading, not drawn to scale.</desc>
<style>
.runner{animation:runx 12s linear infinite}
@keyframes runx{from{transform:translateX(40px)}to{transform:translateX(854px)}}
.legA{animation:legA .28s steps(1) infinite}.legB{animation:legB .28s steps(1) infinite}
@keyframes legA{50%{opacity:0}}@keyframes legB{0%,50%{opacity:0}50.01%{opacity:1}}
.bob{animation:bob .28s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.lit0{animation:lit0 12s linear infinite}@keyframes lit0{0%,2.4%{opacity:.3}2.5%,100%{opacity:1}}
.lit1{animation:lit1 12s linear infinite}@keyframes lit1{0%,26.9%{opacity:.3}27.0%,100%{opacity:1}}
.lit2{animation:lit2 12s linear infinite}@keyframes lit2{0%,51.5%{opacity:.3}51.6%,100%{opacity:1}}
.lit3{animation:lit3 12s linear infinite}@keyframes lit3{0%,76.1%{opacity:.3}76.2%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.runner,.legA,.legB,.bob,.lit0,.lit1,.lit2,.lit3{animation:none}}
</style>
<rect width="900" height="210" fill="#0D1117"/>
<rect x="12" y="12" width="876" height="186" fill="none" stroke="#30363D"/>
<text x="34" y="44" font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" letter-spacing="2.2" fill="#46B57D">THE RUN SO FAR</text>
<text x="34" y="70" font-family='Georgia, "Times New Roman", "Liberation Serif", serif' font-size="20" fill="#E6EDF3">From student to tech lead.</text>
<line x1="44" y1="150" x2="860" y2="150" stroke="#2A3A31" stroke-width="2"/>
<g class="lit0">
<line x1="60" y1="150" x2="60" y2="122" stroke="#46B57D" stroke-width="1.4"/>
<rect x="60" y="116" width="13" height="10" fill="#46B57D"/>
<text x="160" y="106" text-anchor="middle" font-family='"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif' font-size="14" font-weight="600" fill="#E6EDF3">Student</text>
<text x="160" y="172" text-anchor="middle" font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.5" fill="#9BA5AF">2018 – 2022</text>
</g>
<g class="lit1">
<line x1="260" y1="150" x2="260" y2="122" stroke="#46B57D" stroke-width="1.4"/>
<rect x="260" y="116" width="13" height="10" fill="#46B57D"/>
<text x="360" y="106" text-anchor="middle" font-family='"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif' font-size="14" font-weight="600" fill="#E6EDF3">Graduate</text>
<text x="360" y="172" text-anchor="middle" font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.5" fill="#9BA5AF">2022 – 2023</text>
</g>
<g class="lit2">
<line x1="460" y1="150" x2="460" y2="122" stroke="#46B57D" stroke-width="1.4"/>
<rect x="460" y="116" width="13" height="10" fill="#46B57D"/>
<text x="560" y="106" text-anchor="middle" font-family='"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif' font-size="14" font-weight="600" fill="#E6EDF3">Software Engineer</text>
<text x="560" y="172" text-anchor="middle" font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.5" fill="#9BA5AF">2023 – 2025</text>
</g>
<g class="lit3">
<line x1="660" y1="150" x2="660" y2="122" stroke="#46B57D" stroke-width="1.4"/>
<rect x="660" y="116" width="13" height="10" fill="#46B57D"/>
<text x="760" y="106" text-anchor="middle" font-family='"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif' font-size="14" font-weight="600" fill="#E6EDF3">Tech Lead</text>
<text x="760" y="172" text-anchor="middle" font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.5" fill="#9BA5AF">2025 – present</text>
</g>
<line x1="860" y1="150" x2="860" y2="144" stroke="#2A3A31" stroke-width="2"/>
<g class="runner"><g class="bob">
<rect x="-4" y="120" width="9" height="9" fill="#E6EDF3"/>
<rect x="-3" y="130" width="7" height="13" fill="#E6EDF3"/>
<line class="legA" x1="0" y1="142" x2="-5" y2="150" stroke="#E6EDF3" stroke-width="2.4"/>
<line class="legA" x1="1" y1="142" x2="7" y2="150" stroke="#E6EDF3" stroke-width="2.4"/>
<line class="legB" x1="0" y1="142" x2="1" y2="150" stroke="#E6EDF3" stroke-width="2.4"/>
<line class="legB" x1="1" y1="142" x2="2" y2="150" stroke="#E6EDF3" stroke-width="2.4"/>
<line x1="2" y1="132" x2="9" y2="136" stroke="#E6EDF3" stroke-width="2.2"/>
</g></g>
</svg>