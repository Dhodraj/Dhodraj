<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="jt jd">
<title id="jt">A figure running across Dhodraj Sundaram's timeline</title>
<desc id="jd">A self-playing side-scroller. A small figure runs left to right along a ground line past dated milestones from the public history: 2021 coursework, IoT, first web apps; 2022 browser video call; 2024 first npm packages; 2025 seekly on PyPI, ML; 2026 agents, product work.</desc>
<style>
.runner{animation:runx 12s linear infinite}
@keyframes runx{from{transform:translateX(30px)}to{transform:translateX(800px)}}
.legA{animation:legA .28s steps(1) infinite}.legB{animation:legB .28s steps(1) infinite}
@keyframes legA{50%{opacity:0}}@keyframes legB{0%,50%{opacity:0}50.01%{opacity:1}}
.bob{animation:bob .28s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.lit0{animation:lit0 12s linear infinite}@keyframes lit0{0%,0.0%{opacity:.35}0.1%,100%{opacity:1}}
.lit1{animation:lit1 12s linear infinite}@keyframes lit1{0%,24.9%{opacity:.35}25.0%,100%{opacity:1}}
.lit2{animation:lit2 12s linear infinite}@keyframes lit2{0%,49.9%{opacity:.35}50.0%,100%{opacity:1}}
.lit3{animation:lit3 12s linear infinite}@keyframes lit3{0%,74.9%{opacity:.35}75.0%,100%{opacity:1}}
.lit4{animation:lit4 12s linear infinite}@keyframes lit4{0%,99.9%{opacity:.35}100.0%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.runner,.legA,.legB,.bob,.lit0,.lit1,.lit2,.lit3,.lit4{animation:none}}
</style>
